<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程快门</title>
<link rel="stylesheet" href="/app.css?v=2">
<script src="/app.js?v=2"></script>
</head>
<body>
  <div class="bar"><span id="vtitle">📷 远程快门</span>
    <button onclick="location.href='/'">← 返回控制台</button></div>
  <!-- 不写 src：镜像页的流地址由脚本启动时设置，空 src 会让部分浏览器重复请求当前页 -->
  <div class="stage"><img id="v" alt="" draggable="false"></div>
  <div class="status" id="status"></div>
  <div class="ctrls" id="ctrls"></div>
  <script>
    // 本页由后端路由 /cam/back | /cam/front | /cam/mirror 返回；
    // 展示哪一路画面完全由路径决定，避免为三路各维护一份几乎相同的页面。
    const img = document.getElementById('v');
    const statusEl = document.getElementById('status');
    const kind = location.pathname.split('/').pop() || 'back';
    const isMirror = kind === 'mirror';
    const isFront = kind === 'front';
    const camId = isFront ? 'front' : 'back';
    const titles = { back: '后置摄像头', front: '前置摄像头', mirror: '屏幕镜像' };
    const title = titles[kind] || titles.back;
    document.title = '远程快门 - ' + title;
    document.getElementById('vtitle').textContent = '📷 远程快门 · ' + title;

    const CAM_CTRLS = [
      '<button class="cbtn" id="shutter">📸 快门</button>',
      '<button class="cbtn" id="rec">⏺ 录像</button>',
      '<button class="cbtn" id="mirrorBtn">🔁 镜像</button>',
      '<button class="cbtn" id="rotBtn">🔄 旋转</button>',
      '<button class="cbtn" id="zin">🔍＋</button>',
      '<button class="cbtn" id="zout">🔍－</button>',
      '<button class="cbtn" id="zreset">↺ 复位</button>',
      '<button class="cbtn" id="fs">⛶ 全屏</button>'
    ].join('');

    const MIRROR_CTRLS = [
      '<button class="cbtn" id="zin">🔍＋</button>',
      '<button class="cbtn" id="zout">🔍－</button>',
      '<button class="cbtn" id="zreset">↺ 复位</button>',
      '<button class="cbtn" id="fs">⛶ 全屏</button>',
      '<span class="sep"></span>',
      '<button class="cbtn key" data-key="back">↩ 返回</button>',
      '<button class="cbtn key" data-key="home">🏠 主页</button>',
      '<button class="cbtn key" data-key="recent">▦ 后台</button>',
      '<button class="cbtn key" data-key="volup">🔊 音量＋</button>',
      '<button class="cbtn key" data-key="voldown">🔉 音量－</button>',
      '<button class="cbtn key" data-key="lock">🔒 锁屏</button>',
      '<button class="cbtn key" data-key="screenshot">📸 截图</button>',
      '<span class="sep"></span>',
      '<button class="cbtn" id="sysAudio">🔈 镜像声音</button>',
      '<span class="sep"></span>',
      '<button class="cbtn abtn on" data-rate="48000">🔊 清晰</button>',
      '<button class="cbtn abtn" data-rate="16000">⚡ 流畅</button>',
      '<button class="cbtn abtn" data-rate="8000">📞 省流</button>',
      '<span class="sep"></span>',
      '<button class="cbtn qbtn" data-w="480" data-q="45">⚡ 流畅</button>',
      '<button class="cbtn qbtn on" data-w="720" data-q="55">⚖ 标准</button>',
      '<button class="cbtn qbtn" data-w="1080" data-q="65">🔎 清晰</button>'
    ].join('');

    document.getElementById('ctrls').innerHTML = isMirror ? MIRROR_CTRLS : CAM_CTRLS;

    // 缩放/平移数值由共享模块维护，transform 由本页拼装（叠加镜像/旋转）
    const st = { mirror: false, rot: 0 };
    const zp = RS.createZoomPan(applyX);
    RS.bindZoomButtons(zp, { in: 'zin', out: 'zout', reset: 'zreset' });
    RS.bindFullscreen('fs');
    function applyX() {
      var t = 'translate(' + zp.pan.x + 'px,' + zp.pan.y + 'px) scale(' + zp.zoom + ')';
      if (st.mirror) t += ' scaleX(-1)';
      if (st.rot) t += ' rotate(' + st.rot + 'deg)';
      img.style.transformOrigin = 'center center';
      img.style.transform = t;
    }
    const mirrorBtn = document.getElementById('mirrorBtn');
    const rotBtn = document.getElementById('rotBtn');
    if (mirrorBtn) mirrorBtn.onclick = function(){ st.mirror = !st.mirror; applyX(); };
    if (rotBtn) rotBtn.onclick = function(){ st.rot = (st.rot + 90) % 360; applyX(); };

    if (isMirror) {
      // 屏幕镜像：系统媒体声 + 点击/滑动注入 + 断流自动重连
      RS.bindKeyButtons('.key');
      const sysAudio = RS.bindSystemAudio('sysAudio', function(t){ statusEl.textContent = t; });
      RS.bindGestures(img, zp, {
        onTap: function(nx, ny){ RS.sendTap(nx, ny, 'tap'); },
        onSwipe: function(x1, y1, x2, y2){ RS.sendTap(x1, y1, 'swipe', x2, y2); }
      });
      const mirrorStream = RS.bindMirrorStream(img, {
        start: '/screenmirror?start=1',
        stop: '/screenmirror?stop=1',
        status: '/screenmirror/status',
        stream: '/screenmirror',
        onStatus: function(t){ statusEl.textContent = t; }
      });
      // 清晰度切换：机型性能差异大，固定档位不够用，交给用户现场挑
      document.querySelectorAll('.qbtn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.qbtn').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          mirrorStream.setQuality(
            parseInt(b.getAttribute('data-w'), 10),
            parseInt(b.getAttribute('data-q'), 10)
          );
        });
      });
      // 音质（采样率）切换：系统媒体声，应对不同网络环境
      const aBtns = document.querySelectorAll('.abtn');
      aBtns.forEach(function (b) {
        b.addEventListener('click', function () {
          aBtns.forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          sysAudio.setRate(+b.getAttribute('data-rate'));
        });
      });
      mirrorStream.start();
    } else {
      // 前置/后置摄像头：直接拉对应 MJPEG 预览流
      img.src = isFront ? '/video/front' : '/video';
      const shutter = document.getElementById('shutter');
      const rec = document.getElementById('rec');
      let recording = false;
      if (shutter) shutter.onclick = async function(){
        statusEl.textContent = '拍摄中…';
        try {
          const r = await fetch('/capture?cam=' + camId, { method: 'POST' });
          const j = await r.json();
          statusEl.textContent = j.ok ? '✓ 已保存' : '✗ 失败';
        } catch (e) { statusEl.textContent = '请求失败'; }
      };
      if (rec) rec.onclick = async function(){
        try {
          if (!recording) {
            const r = await fetch('/record/start?cam=' + camId, { method: 'POST' });
            const j = await r.json();
            if (j.ok) { recording = true; rec.textContent = '⏹ 停止'; }
          } else {
            await fetch('/record/stop', { method: 'POST' });
            recording = false;
            rec.textContent = '⏺ 录像';
          }
        } catch (e) { }
      };
    }
  </script>
</body></html>
