name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RemoteShutter.xcodeproj \
            -scheme RemoteShutter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/RemoteShutter.app" Payload/
          zip -qry RemoteShutter-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteShutter-unsigned-ipa
          path: RemoteShutter-unsigned.ipa
          if-no-files-found: error
